apiVersion: v1
kind: Pod
metadata:
  name: ndepa-test-secure
  namespace: default
  labels:
    app: ndepa-test-secure
spec:
  containers:
  - name: secure-app
    image: alpine:latest
    command: ["sh", "-c", "sleep 3600"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 10001
      capabilities:
        drop:
        - ALL
