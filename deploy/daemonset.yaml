apiVersion: v1
kind: Namespace
metadata:
  name: ndepa-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ndepa-exporter-sa
  namespace: ndepa-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ndepa-exporter-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ndepa-exporter-binding
subjects:
  - kind: ServiceAccount
    name: ndepa-exporter-sa
    namespace: ndepa-system
roleRef:
  kind: ClusterRole
  name: ndepa-exporter-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ndepa-trace-agent
  namespace: ndepa-system
  labels:
    app.kubernetes.io/name: ndepa-trace-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ndepa-trace-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ndepa-trace-agent
    spec:
      serviceAccountName: ndepa-exporter-sa
      hostNetwork: true
      hostPID: true
      containers:
        - name: ndepa-tracer
          image: ndepa-scan:latest
          imagePullPolicy: IfNotPresent
          args:
            - "trace"
          securityContext:
            privileged: true
            capabilities:
              add:
                - BPF
                - SYS_ADMIN
                - NET_ADMIN
          volumeMounts:
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: bpf-fs
              mountPath: /sys/fs/bpf
      volumes:
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
